

services:
  # Backend Service - Python FastAPI + ML Model
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agromind-backend
    restart: unless-stopped
    volumes:
      - backend_data:/app/models
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    ports:
      - "7860:7860"
    networks:
      - agromind-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:7860/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Service - React + Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: agromind-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - agromind-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  agromind-network:
    driver: bridge

volumes:
  backend_data:
